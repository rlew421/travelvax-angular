<main>
  <section class="max-w-4xl mx-auto px-6 flex justify-center mt-14">
    <app-create-itinerary-form
      [countries]="countries"
      (itineraryCreated)="addItinerary($event)"
    ></app-create-itinerary-form>
  </section>

  <section class="mt-14 px-6">
    <div class="flex flex-wrap justify-center gap-12">
      @for (itinerary of itineraries; track itinerary.id) {
        <app-itinerary-card [itinerary]="itinerary"></app-itinerary-card>
      }
    </div>
  </section>
</main>
