<a [routerLink]="['/itineraries', itinerary.id]" class="block w-full max-w-[340px]">
  <div class="bg-white rounded-3xl shadow-lg overflow-hidden w-full transition hover:-translate-y-1">
    <div class="aspect-[4/3]">
      <img
        [src]="randomImg"
        [alt]="itinerary.name"
        class="w-full h-full object-cover transition-transform duration-300 ease-in-out hover:scale-105"
      />
    </div>
    <div class="p-6">
      <h2 class="text-xl font-bold tracking-tight mb-2">{{ itinerary.name }}</h2>
      <p class="text-sm text-slate-400">{{ countryNames }}</p>
    </div>
  </div>
</a>
